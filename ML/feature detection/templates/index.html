<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Data Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: white;
            padding: 20px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h2 {
            color: #333;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        .highlight {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Historical Data for <span class="highlight">{{ class_name }}</span></h2>
        <p><strong>Description:</strong> {{ description }}</p>
        <p><strong>Time Period:</strong> {{ time_period }}</p>
        <p><strong>Origin:</strong> {{ origin }}</p>
        <p><strong>Cultural Significance:</strong> {{ cultural_significance }}</p>
        <p><strong>Confidence:</strong> {{ confidence | round(2) }}</p>
    </div>

    <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Upload & Predict</button>
    </form>
</body>
</html>
